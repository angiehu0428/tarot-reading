<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#3b2178"/>
      <stop offset="45%" stop-color="#1c0e44"/>
      <stop offset="100%" stop-color="#08031a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e27a"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a07c1a"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d878" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#d4af37" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="86" fill="none" stroke="url(#goldLine)" stroke-width="4"/>
  <rect x="34" y="34" width="444" height="444" rx="74" fill="none" stroke="#d4af37" stroke-width="1.5" opacity=".25"/>

  <!-- 光暈 -->
  <circle cx="256" cy="238" r="190" fill="url(#halo)"/>

  <!-- 小星點 -->
  <g fill="#f0d878">
    <circle cx="120" cy="120" r="4" opacity=".8"/>
    <circle cx="400" cy="96" r="3" opacity=".6"/>
    <circle cx="430" cy="200" r="2.5" opacity=".5"/>
    <circle cx="90" cy="300" r="2.5" opacity=".5"/>
    <circle cx="150" cy="412" r="3" opacity=".55"/>
    <circle cx="392" cy="392" r="4" opacity=".7"/>
  </g>
  <g fill="#fff" opacity=".85">
    <path d="M392 132 l4 12 12 4 -12 4 -4 12 -4-12 -12-4 12-4 Z"/>
    <path d="M116 360 l3 9 9 3 -9 3 -3 9 -3-9 -9-3 9-3 Z"/>
  </g>

  <!-- 月牙 -->
  <path d="M150 168 a64 64 0 1 0 70 96 a52 52 0 1 1 -70 -96 Z" fill="url(#gold)" opacity=".5" filter="url(#glow)"/>

  <!-- 主星 -->
  <g transform="translate(276 248)" filter="url(#glow)">
    <path d="M0-128 L24-34 L118-34 L43 24 L72 118 L0 60 L-72 118 L-43 24 L-118-34 L-24-34 Z" fill="url(#gold)"/>
    <circle r="23" fill="#1c0e44"/>
    <circle r="12" fill="#f6e27a"/>
  </g>
</svg>
