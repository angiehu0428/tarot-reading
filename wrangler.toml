name = "tarot-worker"
main = "worker.js"
compatibility_date = "2026-06-01"

[[kv_namespaces]]
binding = "TAROT_KV"
id = "d8831c1811f942b295fe670e3b9910c3"

# 每 6 小時自動檢查一次 Gemini API 是否還能正常呼叫（防止 Google 又悄悄
# 下架/改名模型導致 AI 解牌全站中斷卻沒人發現，見 worker.js 的 scheduled()）。
[triggers]
crons = ["0 */6 * * *"]

# Gemini API 是依「請求最後從哪個網路位置送出」判斷地區的。Worker 預設在「離用戶最近
# 的節點」執行，請求也從該節點送出——台灣是 Gemini 的支援地區，但台灣用戶偶爾會被路由
# 到香港等不支援地區的節點，Google 就回 400「User location is not supported for the
# API use.」，用戶完全不知道發生什麼事（還會誤以為是自己額度用完）。
# 這裡請 Worker 盡量在美西執行（region 只是建議，2026-11 起 Gemini 另外改走下方的美國中繼 DO 才算真的保證）。
# 代價：驗證/同步等小 API 對台灣用戶多約 100-150ms（AI 解牌本來就要數秒，感覺不出來）。
# 驗證方式：開 https://tarot-worker.angiehu.workers.dev/version 看 geminiViaUS 是不是 true。
[placement]
region = "gcp:us-west1"

# Gemini 美國中繼（見 worker.js GeminiProxy）：[placement] region 只是建議，香港機房照樣會被 Google 擋
[[durable_objects.bindings]]
name = "GEMINI_PROXY"
class_name = "GeminiProxy"

[[migrations]]
tag = "v1-gemini-proxy"
new_sqlite_classes = ["GeminiProxy"]

# 登入閘門（見 worker.js AuthGate）：驗證碼錯幾次／用過即作廢、購後兌換碼只能兌一次、IP 計數，
# 都在 Durable Object 裡做，才不會像 KV 那樣同時兩個請求互相蓋掉
[[durable_objects.bindings]]
name = "AUTH_GATE"
class_name = "AuthGate"

[[migrations]]
tag = "v2-auth-gate"
new_sqlite_classes = ["AuthGate"]

# 登入驗證碼寄信：之後網域在 Cloudflare Email Sending 上線後，再加
#   [[send_email]]
#   name = "EMAIL"
# 並設 var MAIL_FROM（如 "塔羅占卜 <tarot@angiehu.com>"）。沒綁 EMAIL 時 worker 會改用 Resend
# （secrets RESEND_API_KEY + EMAIL_FROM）。
