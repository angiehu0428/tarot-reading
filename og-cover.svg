<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#2a1660"/>
      <stop offset="55%" stop-color="#150830"/>
      <stop offset="100%" stop-color="#08031a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e27a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a07c1a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity=".5"/>
      <stop offset="60%" stop-color="#d4af37" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="#f0d878">
    <circle cx="140" cy="120" r="3" opacity=".7"/><circle cx="320" cy="80" r="2" opacity=".5"/>
    <circle cx="1050" cy="110" r="3" opacity=".6"/><circle cx="1120" cy="260" r="2" opacity=".5"/>
    <circle cx="90" cy="380" r="2.5" opacity=".5"/><circle cx="1080" cy="470" r="2.5" opacity=".5"/>
    <circle cx="240" cy="520" r="2" opacity=".5"/><circle cx="960" cy="560" r="3" opacity=".6"/>
  </g>
  <circle cx="600" cy="250" r="240" fill="url(#halo)"/>
  <!-- 月牙 -->
  <path d="M470 150 a92 92 0 1 0 102 140 a75 75 0 1 1 -102 -140 Z" fill="url(#gold)" opacity=".45" filter="url(#glow)"/>
  <!-- 主星 -->
  <g transform="translate(640 240)" filter="url(#glow)">
    <path d="M0-150 L28-40 L138-40 L50 28 L84 138 L0 70 L-84 138 L-50 28 L-138-40 L-28-40 Z" fill="url(#gold)"/>
    <circle r="27" fill="#150830"/><circle r="14" fill="#f6e27a"/>
  </g>
  <text x="600" y="470" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif" font-size="92" font-weight="700" fill="url(#gold)" filter="url(#glow)" letter-spacing="10">塔羅神諭</text>
  <text x="600" y="540" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#b8b0c8" letter-spacing="6">TAROT ORACLE</text>
  <text x="600" y="588" text-anchor="middle" font-family="'Noto Serif TC',serif" font-size="24" fill="rgba(212,175,55,.75)" letter-spacing="2">免費線上塔羅占卜 · AI 個人化解牌 · Free AI Tarot</text>
</svg>
